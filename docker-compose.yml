    # ----------------------------------------
    # PHP Application (Laravelの実行環境)
    # ----------------------------------------
    app:
        build:
            context: ./docker/app
            dockerfile: Dockerfile
        container_name: laravel_app
        volumes:
            # プロジェクトコードをコンテナと共有
            - .:/var/www/html
        # Nginxとの通信のためにポートを公開（外部に公開はしない）
        expose:
            - 9000
        depends_on:
            - db

    # ----------------------------------------
    # Web サーバー (Nginx)
    # ----------------------------------------
    nginx:
        image: nginx:stable-alpine
        container_name: laravel_nginx
        # 外部からポート80でアクセスできるようにする
        ports:
            - "8080:80"
        volumes:
            # プロジェクトコードとNginxの設定ファイルを共有
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
            - db

    # DBサーバー
    db:
        # コンテナ名
        container_name: "exsample_db2"
        # コンテナの作成に使用するDockerfileのパス
        build:
          dockerfile: "./docker/db/Dockerfile"
        # ホスト側のポート:コンテナ側のポートを指定
        ports:
          - "3307:3306"
        # 環境変数の指定
        environment:
          - "MYSQL_ROOT_PASSWORD=root"
          - "MYSQL_DATABASE=test"
          - "MYSQL_USER=dev"
          - "MYSQL_PASSWORD=dev"
        # srcディレクトリ内のファイルをコンテナ内の~/var/www/html配下にマウント
        volumes:
#          - ./docker/db/my.cnf:/etc/mysql/conf.d/my.cnf
#          - ./docker/db/data:/var/lib/mysql
        # データを永続化するためのボリューム
        - db_data:/var/lib/mysql
#        networks:
#        - laravel-network

